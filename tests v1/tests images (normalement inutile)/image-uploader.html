<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload d'Images - Drag & Drop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .drop-zone {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: #f8f9ff;
        }

        .drop-zone.dragover {
            background: #e8ebff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .drop-zone-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .drop-zone-text {
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .drop-zone-hint {
            color: #999;
            font-size: 14px;
        }

        #fileInput {
            display: none;
        }

        .input-group {
            margin-top: 25px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .preview-container {
            margin-top: 25px;
            display: none;
        }

        .preview-container.active {
            display: block;
        }

        .preview-image {
            width: 100%;
            border-radius: 10px;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .file-info {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        .success-message {
            background: #10b981;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-message {
            background: #ef4444;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        .error-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Upload d'Images</h1>
        <p class="subtitle">Glissez-déposez votre image ou cliquez pour sélectionner</p>

        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-icon">☁️</div>
            <div class="drop-zone-text">Déposez votre image ici</div>
            <div class="drop-zone-hint">ou cliquez pour parcourir</div>
        </div>

        <input type="file" id="fileInput" accept="image/*">

        <div class="preview-container" id="previewContainer">
            <label>Aperçu :</label>
            <img id="previewImage" class="preview-image" alt="Aperçu">
            <div class="file-info" id="fileInfo"></div>
        </div>

        <button class="btn" id="saveBtn" disabled>💾 Sauvegarder l'image</button>

        <div class="success-message" id="successMessage">
            ✓ Image sauvegardée avec succès !
        </div>

        <div class="error-message" id="errorMessage">
            ✗ Une erreur est survenue
        </div>
    </div>

    <script src="scripts/bdd.js"></script>
    <script>
        // ===== CONFIGURATION : Modifiez ce nom de fichier =====
        let FIXED_FILENAME = 'image'+ (bdd.length-1) ;
        // ======================================================

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const fileInfo = document.getElementById('fileInfo');
        const saveBtn = document.getElementById('saveBtn');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        let selectedFile = null;
        let fileExtension = '';

        // Click sur la zone de drop
        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        // Drag over
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        // Drag leave
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        // Drop
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // Sélection de fichier via input
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            // Vérifier que c'est bien une image
            if (!file.type.startsWith('image/')) {
                showError('Veuillez sélectionner une image valide');
                return;
            }

            selectedFile = file;
            fileExtension = file.name.split('.').pop();

            // Afficher l'aperçu
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewContainer.classList.add('active');
                
                // Afficher les infos du fichier
                const sizeKB = (file.size / 1024).toFixed(2);
                fileInfo.innerHTML = `
                    <strong>Fichier:</strong> ${file.name}<br>
                    <strong>Taille:</strong> ${sizeKB} KB<br>
                    <strong>Type:</strong> ${file.type}<br>
                    <strong>Sera sauvegardé sous:</strong> ${FIXED_FILENAME}.${fileExtension}
                `;
                
                // Activer le bouton de sauvegarde
                saveBtn.disabled = false;

                // Masquer les messages
                successMessage.classList.remove('show');
                errorMessage.classList.remove('show');
            };
            reader.readAsDataURL(file);
        }

        // Sauvegarder l'image
        saveBtn.addEventListener('click', () => {
            if (!selectedFile) {
                showError('Aucune image sélectionnée');
                return;
            }

            // Créer un lien de téléchargement avec le nom fixe
            const reader = new FileReader();
            reader.onload = (e) => {
                const link = document.createElement('a');
                link.href = e.target.result;
                link.download = `${FIXED_FILENAME}.${fileExtension}`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // Afficher le message de succès
                successMessage.textContent = `✓ Image sauvegardée sous ${FIXED_FILENAME}.${fileExtension}`;
                successMessage.classList.add('show');
                errorMessage.classList.remove('show');
            };
            reader.readAsDataURL(selectedFile);
        });

        function showError(message) {
            errorMessage.textContent = `✗ ${message}`;
            errorMessage.classList.add('show');
            successMessage.classList.remove('show');
            
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
