<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Exemple de formulaire N°4</title>
	
	<script>
	function toutCocher2()
	{
	  var item = document.getElementsByName('preference[]');
	  for (i=0;i<item.length;i++)
	  {
		if (item[i].disabled == false)
			item[i].checked = monFormulaire.tout.checked;
	  }
	}

	</script>
  </head>
  <body>
    <form id="monFormulaire" name="monFormulaire" action = "traitement_form_etu.php" method="post" enctype="application/x-www-form-urlencoded">
	<fieldset>
  	    <legend>Identité</legend>
		<br/>
		<label for="nom">nom : </label><input type="text" id="nom" name="nom" size="20" value="" placeholder="votre nom" ><br />
		<label for="prenom">prénom : </label><input type="text" id="prenom" name="prenom" size="20" value="" pattern="[A-Za-z0-9]*"><br />
        <label for="code">Mot de passe : </label><input type="password" id="code" name="code" size="20"  AUTOCOMPLETE=OFF> <br />
		<br/>
		<label for="genreF"> Femme :</label><input type="radio" name="genre" id="genreF" value="femme" checked> <br />
		<label for="genreH"> Homme :</label><input type="radio" name="genre" id="genreH" value="homme" > <br />
		<select name="pays" size="1">		
	      <option value="france"> France</option>
	      <option value="belgique" selected> Belgique</option>
	      <option value="suisse"> Suisse</option>
	      <option value="canada"> Canada</option>
        </select>
        <br/><br/>	   
	  </fieldset>
	  <!-- Deuxième groupe de composants-->
      <fieldset>
        <legend><b>Ce que vous préférez dans la vie</b></legend>
		<input type="checkbox" name="tout" value="tout"  onclick="toutCocher2()"> Tout cocher/Tout décocher<br />
		<input type="checkbox" name="preference[]" value="bdd"   >Bases de données<br />
		<input type="checkbox" name="preference[]" value="oracle" >Oracle<br />
		<input type="checkbox" name="preference[]" value="triggers" >  Triggers<br />
		<input type="checkbox" name="preference[]" value="sql"  > SQL<br />
		<input type="checkbox" name="preference[]" value="MCD"  > MCD<br />
		<input type="checkbox" name="preference[]" value="PLSQL" >  PL/SQL<br /> 
	    <input type="checkbox" name="preference[]" value="access" disabled="disabled"> access<br />
		<textarea name="gouts" cols="50" rows="5"  placeholder="Quoi d'autre"></textarea>
        <br />
	    <br />
      </fieldset>
	  <!-- troisième groupe de composants-->
		<input type="submit" name="BtSub" value="Envoyer">		&nbsp;&nbsp;&nbsp;
        <br />
      <br />
	</form>
  </body>
</html>

<!-- 
la balise form a été complétée avec :
  name="monFormulaire" : utilisable en php
  id="monFormulaire" : utilisable en HTML, CSS et Javascript
  action = "9_2_4_post.php" : fichier php appelé en cas de validation du formulaire
  method="post"  : les données sont transmises dans le corps de la requête.
  enctype="application/x-www-form-urlencoded" : classqiue

  On peut utiliser autocomplete="on" pour l'autocomplétion du formulaire

  l'attribut required rend le champ obligatoire
  l'attribut pattern permet de placer une expression régulière pour un champ
    on utilise ici un tableau pour les checkbox (et on utilise toutcocher2() 
 -->
